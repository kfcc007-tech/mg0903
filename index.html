<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MG 상생 희망드림 대출 기획 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans relative">

    <a href="https://kfcc007-tech.github.io/mg0903/cal" 
       target="_blank" 
       rel="noopener noreferrer" 
       class="fixed top-6 right-6 z-50 inline-flex items-center justify-center px-5 py-2.5 text-sm font-bold text-white transition-all bg-emerald-600 rounded-lg shadow-lg hover:bg-emerald-700 hover:shadow-xl hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2">
      <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
      </svg>
      금융계산기 열기
      <svg class="w-3.5 h-3.5 ml-1.5 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
      </svg>
    </a>
    <div class="max-w-6xl mx-auto px-4 py-12">
        <header class="mb-10 border-b border-slate-200 pb-6 pr-40">
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">MG 상생 희망드림 대출</h1>
            <p class="mt-2 text-slate-600 text-lg">새마을금고 지역 밀착형 소상공인 금융지원 상품 기획안</p>
        </header>
        
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-12">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-sm text-slate-500 font-bold mb-1">대출 총 규모 (추정)</p>
                <p class="text-2xl font-black text-emerald-600">3,000억 원</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-sm text-slate-500 font-bold mb-1">최대 우대금리</p>
                <p class="text-2xl font-black text-emerald-600">1.5%p</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-sm text-slate-500 font-bold mb-1">예상 지원 모수</p>
                <p class="text-2xl font-black text-emerald-600">약 15,000건</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-sm text-slate-500 font-bold mb-1">신용보증재단 연계</p>
                <p class="text-2xl font-black text-emerald-600">100% 전액보증</p>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="text-lg font-bold text-slate-800 mb-4">항목별 우대금리 구조 (최대 1.5%p)</h3>
                <div class="relative h-64">
                    <canvas id="rateChart"></canvas>
                </div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="text-lg font-bold text-slate-800 mb-4">특별출연금 대비 레버리지 공급 효과</h3>
                <div class="relative h-64">
                    <canvas id="leverageChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. 우대금리 차트
        const ctxRate = document.getElementById('rateChart').getContext('2d');
        new Chart(ctxRate, {
            type: 'bar',
            data: {
                labels: ['지역화폐 가맹', '전통시장 상인', 'MG더뱅킹 가입', '자동이체/카드 연계'],
                datasets: [{
                    label: '우대 한도 (%p)',
                    data: [0.5, 0.5, 0.3, 0.2],
                    backgroundColor: '#10b981',
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, max: 0.6 }
                },
                plugins: { legend: { display: false } }
            }
        });

        // 2. 레버리지 효과 차트
        const ctxLeverage = document.getElementById('leverageChart').getContext('2d');
        new Chart(ctxLeverage, {
            type: 'doughnut',
            data: {
                labels: ['새마을금고 특별출연금 (200억)', '신보 보증서 기반 여신창출 (2,800억)'],
                datasets: [{
                    data: [200, 2800],
                    backgroundColor: ['#047857', '#34d399'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '70%',
                plugins: {
                    legend: { position: 'bottom' }
                }
            }
        });
    </script>
</body>
</html>
